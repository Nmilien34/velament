services:
  mongodb:
    image: mongo:8
    command: [mongod, --replSet, rs0, --bind_ip_all]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongodb-init:
    image: mongo:8
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      [
        mongosh,
        "mongodb://mongodb:27017/?directConnection=true",
        --quiet,
        --eval,
      ]
    command:
      [
        "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) }",
      ]
volumes:
  mongodb_data:

name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' && break || sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary) quit(1)' && break || sleep 2; done
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          CI_REPORT_PATH: ../coverage/backend-results.json
      - name: Generate backend evidence report
        if: always() && hashFiles('coverage/backend-results.json') != ''
        run: node velament-backend/dist/scripts/report-ci.js coverage/backend-results.json coverage/velament-test-report.json
      - name: Upload backend evidence report
        if: always() && hashFiles('coverage/velament-test-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: coverage/velament-test-report.json
          retention-days: 7
          if-no-files-found: error
